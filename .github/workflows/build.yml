name: Build

on:
  pull_request:
    paths-ignore:
      - '.images/*'
      - 'LICENSE'
      - '.gitignore'
      - '*.md'
    branches: [ master ]
  push:
    paths-ignore:
      - '.images/*'
      - 'LICENSE'
      - '.gitignore'
      - '*.md'
    branches: [ master ]

jobs:
  Xbox:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Build via Docker
      run: |
        docker build --platform linux/amd64 -f Dockerfile.xbox --target builder -t sodiumx-xbox .
        mkdir -p out
        docker run --rm --platform linux/amd64 -v "$(pwd)/out":/out sodiumx-xbox \
          sh -c "cp /usr/src/sodiumx/bin/default.xbe /usr/src/sodiumx/SodiumX.iso /out/"
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: dash_xbox
        path: |
          out/SodiumX.iso
          out/default.xbe

  Windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
    - name: Install and Setup Dependencies
      run: |
        pacman -S mingw-w64-x86_64-make --noconfirm
        pacman -S mingw-w64-x86_64-cmake --noconfirm
        pacman -S mingw-w64-x86_64-gcc --noconfirm
        pacman -S mingw-w64-x86_64-SDL2 --noconfirm
        pacman -S mingw-w64-x86_64-libjpeg-turbo --noconfirm
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Compile
      run: |
        mkdir build && cd build
        cmake .. -G "MinGW Makefiles"
        cmake --build .
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: dash_windows
        path: |
          build/SodiumX.exe
